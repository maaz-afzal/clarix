name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/clarix_test

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/clarix_build
          AUTH_SECRET: ci-only-secret
          AUTH_TRUST_HOST: "true"
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"